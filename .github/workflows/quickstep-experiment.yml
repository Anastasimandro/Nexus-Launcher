name: Quickstep experiment

# Experimento puntual, no publica nada: ¿puede Nexus ser el proveedor de recientes con un overlay
# normal (no estático)? Usa los archivos de la última release, no compila nada. Los resultados se
# suben a la rama quickstep-validation-results. Ver .github/scripts/experiment-dynamic-overlay.sh.
on:
  push:
    branches:
      - 'experiment-dynamic-overlay'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: quickstep-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Bajar el APK y el módulo de la última release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist results
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q '.tag_name' | tee results/release-tag.txt
          fetch() {
            row=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q ".assets[] | select($1) | \"\(.url) \(.name)\"" | head -n 1)
            [ -n "$row" ] || { echo "::error::No encuentro el archivo ($1) en la release"; exit 1; }
            url=${row%% *}; name=${row#* }
            gh api -H "Accept: application/octet-stream" "$url" > "dist/$name"
          }
          fetch '(.name|startswith("Nexus-v")) and (.name|endswith(".apk"))'
          fetch '(.name|startswith("Nexus-MagiskModule-v")) and (.name|endswith(".zip"))'
          ls -l dist

      - name: Liberar disco y activar KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador Android y experimento
        timeout-minutes: 80
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EMU_GPU: swangle_indirect
        run: |
          .github/scripts/emulator-up.sh 37 results
          .github/scripts/experiment-dynamic-overlay.sh dist results

      - name: Subir resultados
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/push-results.sh results dynamic-overlay
