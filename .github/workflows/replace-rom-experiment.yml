name: Replace ROM launcher experiment

# Experimento puntual, no publica nada: ¿recibe Nexus los permisos de recientes si lleva el mismo
# paquete que el launcher de la ROM y se instala en su lugar (sin overlay)? Resultados en la rama
# quickstep-validation-results. Ver .github/scripts/experiment-replace-rom.sh.
on:
  push:
    branches:
      - 'experiment-replace-rom'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: replace-rom-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Compilar con el paquete del Pixel Launcher
        env:
          NEXUS_VERSION: '0.99'
          NEXUS_APPLICATION_ID: com.google.android.apps.nexuslauncher
        run: ./gradlew assembleLawnWithQuickstepGithubRelease 2>&1 | tee gradle-build.log
      - name: Resumir errores de compilación
        if: failure()
        run: bash .github/scripts/gradle-errors.sh gradle-build.log "Compilación del experimento"
      - name: Reunir el APK
        run: |
          shopt -s nullglob
          apks=(build/outputs/apk/lawnWithQuickstepGithub/release/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::Esperaba un APK y hay ${#apks[@]}"; exit 1; }
          mkdir -p dist
          cp "${apks[0]}" dist/Nexus-rom-package.apk
          aapt2=$(ls /usr/local/lib/android/sdk/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump badging dist/Nexus-rom-package.apk | sed -n 1p || true
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Liberar disco y activar KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android y experimento
        timeout-minutes: 80
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EMU_GPU: swangle_indirect
        run: |
          mkdir -p results
          .github/scripts/emulator-up.sh 37 results
          .github/scripts/experiment-replace-rom.sh dist/Nexus-rom-package.apk results
      - name: Subir resultados
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/push-results.sh results replace-rom
