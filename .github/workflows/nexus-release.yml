name: Nexus release

# Cada push a la rama 16-dev publica una release con versión numérica:
#   0.1  ->  0.1.1  ->  0.1.2  ->  ...
# Para saltar de línea (p. ej. a 0.2): pestaña Actions > "Nexus release" > Run workflow
# y escribe la versión. Después siguen 0.2.1, 0.2.2, ...
# Detalles, firma y solución de problemas: RELEASING.md
on:
  push:
    branches:
      - '16-dev'
    paths-ignore:
      - '.idea/**'
      - '.gitignore'
      - '**.md'
      - 'LICENSE.txt'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión exacta (ej. 0.2 o 0.2.1). Vacío = la siguiente automática'
        required: false
        default: ''

permissions:
  contents: write

# Una release a la vez: evita que dos pushes seguidos calculen la misma versión.
concurrency:
  group: nexus-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Siguiente versión = la etiqueta vX.Y[.Z] más alta + 1 en el último número.
      - name: Calcular versión
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' > tags.txt
          .github/scripts/next-version.sh "$REQUESTED" < tags.txt | tee -a "$GITHUB_OUTPUT"
          rm -f tags.txt

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # La clave de firma sale de los secrets KEYSTORE (base64), KEYSTORE_PASSWORD,
      # KEY_ALIAS y KEY_PASSWORD. Sin ellos NO se publica nada: un APK firmado con otra
      # clave (la de depuración cambia en cada ejecución) no se podría actualizar encima.
      - name: Preparar firma
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Falta la clave de firma::No están definidos los secrets:$missing. Sin la clave de siempre el APK no se podría actualizar sin desinstalar. Ver RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/key.jks"
          } > keystore.properties

      - name: Compilar APK
        env:
          NEXUS_VERSION: ${{ steps.version.outputs.version }}
          NEXUS_REQUIRE_RELEASE_SIGNING: 'true'
        run: ./gradlew assembleLawnWithQuickstepGithubRelease

      # Comprueba el APK real: paquete, versión, versionCode y que la firma es la de siempre.
      - name: Verificar APK
        id: verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          shopt -s nullglob
          apks=(build/outputs/apk/lawnWithQuickstepGithub/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error title=APK no encontrado::Esperaba exactamente un APK en build/outputs/apk/lawnWithQuickstepGithub/release y hay ${#apks[@]}."
            exit 1
          fi
          mkdir -p dist
          cp "${apks[0]}" "dist/Nexus-${VERSION}.apk"
          .github/scripts/verify-apk.sh "dist/Nexus-${VERSION}.apk" "$VERSION" "$VERSION_CODE" | tee -a "$GITHUB_OUTPUT"
          (cd dist && sha256sum "Nexus-${VERSION}.apk" > "Nexus-${VERSION}.apk.sha256")

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: Nexus-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CERT: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          cat > notes.md <<EOF
          **Nexus Launcher ${VERSION}**

          Se instala **encima** de la versión que tengas, sin desinstalar y sin perder tus ajustes: mismo paquete (\`app.nexus.launcher\`), misma firma y un \`versionCode\` mayor.

          | | |
          |---|---|
          | Versión | ${VERSION} |
          | versionCode | ${VERSION_CODE} |
          | Commit | \`${GITHUB_SHA:0:7}\` |
          | Firma (SHA-256) | \`${CERT}\` |

          **Cómo actualizar:** descarga \`Nexus-${VERSION}.apk\`, ábrelo y pulsa *Actualizar*.
          Comprobación opcional de la descarga: \`sha256sum -c Nexus-${VERSION}.apk.sha256\`.

          ---

          EOF
          args=(--target "$GITHUB_SHA" --title "Nexus Launcher ${VERSION}" --notes-file notes.md --generate-notes --latest)
          if [ -n "$PREVIOUS_TAG" ]; then args+=(--notes-start-tag "$PREVIOUS_TAG"); fi
          gh release create "$TAG" "dist/Nexus-${VERSION}.apk" "dist/Nexus-${VERSION}.apk.sha256" "${args[@]}"
