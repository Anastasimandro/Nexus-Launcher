name: Quickstep validation

# Compila el APK, el módulo y el overlay con las herramientas reales del SDK y los prueba en un
# Android 17 real (emulador con root). No publica nada: los resultados se suben a la rama
# quickstep-validation-results (los artefactos de Actions no se pueden bajar desde fuera).
#
# Es validación, no una prueba en el dispositivo del usuario. Ver magisk-module/README.md.
on:
  push:
    branches:
      - 'root-quickstep-provider'
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      api_level:
        description: 'API del emulador'
        required: false
        default: '37'

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: quickstep-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versión de validación: nunca se publica. versionCode = 1_601_000_000 + mayor*10_000 + menor*100 + parche.
  VALIDATION_VERSION: '0.99'
  VALIDATION_VERSION_CODE: '1601009900'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Sin NEXUS_REQUIRE_RELEASE_SIGNING ni keystore.properties firma con la clave de depuración:
      # no se toca la clave de release.
      - name: Compilar APK
        env:
          NEXUS_VERSION: ${{ env.VALIDATION_VERSION }}
        run: ./gradlew assembleLawnWithQuickstepGithubRelease 2>&1 | tee gradle-build.log

      - name: Resumir errores de compilación
        if: failure()
        run: bash .github/scripts/gradle-errors.sh gradle-build.log "Compilación de validación"

      - name: Reunir APK y generar el módulo
        run: |
          shopt -s nullglob
          apks=(build/outputs/apk/lawnWithQuickstepGithub/release/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::Esperaba un APK y hay ${#apks[@]}"; exit 1; }
          mkdir -p dist results
          cp "${apks[0]}" "dist/Nexus-v${VALIDATION_VERSION}.apk"
          # El mapping de R8 permite leer los nombres originales en la auditoría del DEX.
          cp build/outputs/mapping/lawnWithQuickstepGithubRelease/mapping.txt dist/mapping.txt || echo "sin mapping.txt"
          .github/scripts/build-magisk-module.sh "dist/Nexus-v${VALIDATION_VERSION}.apk" \
            "$VALIDATION_VERSION" "$VALIDATION_VERSION_CODE" "dist/Nexus-MagiskModule-v${VALIDATION_VERSION}.zip"

      - name: Inspeccionar con aapt2 y apksigner reales
        run: .github/scripts/inspect-build.sh dist results "$VALIDATION_VERSION"

      # El estilo se comprueba aparte; que falle no impide seguir (la CI normal ya falla por otro archivo).
      - name: Comprobar estilo (spotless)
        run: ./gradlew spotlessCheck --continue > results/spotless.txt 2>&1 || true

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Subir resultados
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/push-results.sh results build

  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Liberar disco y activar KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h / | tail -1

      # El emulador y la validación van en el mismo paso: un proceso en segundo plano puede no
      # sobrevivir al paso que lo lanzó.
      - name: Emulador Android y validación
        timeout-minutes: 50
        run: |
          mkdir -p results
          .github/scripts/emulator-up.sh "${{ inputs.api_level || '37' }}" results
          .github/scripts/validate-on-emulator.sh dist results

      - name: Subir resultados
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/push-results.sh results android
